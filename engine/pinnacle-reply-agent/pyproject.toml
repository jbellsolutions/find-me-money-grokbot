[project]
name = "pinnacle-officer"
version = "0.1.0"
description = "Toolkits for Pinnacle Funding Group's Hermes agents: the Funding Intake and Loan Processing Officers, and the Reply Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
reply = ["anthropic>=2.3", "mcp>=2.0", "psycopg[binary]>=3.2"]
mac = ["playwright==1.58.0"]
dev = ["pytest>=8"]

[project.scripts]
officer = "pinnacle_officer.cli:main"
officer-mcp = "pinnacle_officer.mcp_server:main"
reply-agent = "pinnacle_reply.cli:main"
reply-agent-mcp = "pinnacle_reply.mcp_server:main"
reply-agent-mac = "pinnacle_reply.mac_lane:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pinnacle_officer", "pinnacle_reply", "pinnacle_reply.platforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
